<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crear cuenta — {{ app_name }}</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-logo">
                <div class="auth-logo-icon"><i data-lucide="scan-face"></i></div>
                <h1>{{ app_name }}</h1>
                <p>Crea tu cuenta para empezar a diagnosticar</p>
            </div>

            <div class="auth-error" id="authError"></div>

            <form id="registerForm" autocomplete="on">
                <div class="form-field">
                    <label for="name">Nombre</label>
                    <div class="form-field-input">
                        <i data-lucide="user"></i>
                        <input type="text" id="name" name="name" placeholder="Tu nombre" required autocomplete="name">
                    </div>
                </div>

                <div class="form-field">
                    <label for="email">Email</label>
                    <div class="form-field-input">
                        <i data-lucide="mail"></i>
                        <input type="email" id="email" name="email" placeholder="tu@email.com" required autocomplete="email">
                    </div>
                </div>

                <div class="form-field">
                    <label for="password">Contraseña</label>
                    <div class="form-field-input">
                        <i data-lucide="lock"></i>
                        <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="new-password">
                        <button type="button" class="form-field-toggle" id="togglePassword"><i data-lucide="eye"></i></button>
                    </div>
                    <div class="form-hint">Mínimo 8 caracteres, con mayúscula, minúscula y número.</div>
                </div>

                <div class="form-field">
                    <label for="confirmPassword">Confirmar contraseña</label>
                    <div class="form-field-input">
                        <i data-lucide="lock"></i>
                        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="••••••••" required autocomplete="new-password">
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-large auth-submit" id="submitBtn">
                    <i data-lucide="user-plus"></i> Crear cuenta
                </button>
            </form>

            <div class="auth-switch">
                ¿Ya tienes cuenta? <a href="/login">Inicia sesión</a>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
    <script>
        lucide.createIcons();
        setupAuthForm({
            formId: 'registerForm',
            endpoint: '/api/auth/register',
            errorId: 'authError',
            submitId: 'submitBtn',
            validate: () => {
                const pw = document.getElementById('password').value;
                const confirm = document.getElementById('confirmPassword').value;
                if (pw !== confirm) return 'Las contraseñas no coinciden.';
                return null;
            },
            buildPayload: () => ({
                name: document.getElementById('name').value.trim(),
                email: document.getElementById('email').value.trim(),
                password: document.getElementById('password').value,
            }),
        });
        setupPasswordToggle('togglePassword', 'password');
    </script>
</body>

</html>
